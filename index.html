<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<meta name="description" content="ByteBell by AkihiroLabs: a weekly timetable that tells you what's now and what's next.">
<title>ByteBell by AkihiroLabs</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Myanmar first so မြန်မာ renders correctly on the first paint -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <button type="button" class="logo" id="logo" aria-label="Byte"><img src="icon.png" alt="" width="34" height="34"></button>
      <div><h1>ByteBell</h1><span class="by">by AkihiroLabs</span></div>
    </div>
    <div class="head-right">
    <button type="button" class="auth-btn" id="authBtn" hidden></button>
    <div class="lang" role="group" id="lang">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="my">မြန်မာ</button>
    </div>
    </div>
  </header>

  <div class="demo-bar" id="demoBar" hidden>
    <span id="demoText"></span>
    <button type="button" class="demo-exit" id="exitDemo"></button>
  </div>

  <p class="warn" id="warn" hidden></p>

  <main class="layout">
    <section class="bell" id="bell" aria-live="polite" hidden></section>
    <div id="views"></div>
  </main>

  <footer>
    <p class="foot-brand"><img src="icon.png" alt="" class="foot-mark" width="20" height="20"><strong>ByteBell</strong> <span>by AkihiroLabs</span></p>
    <p id="footNote"></p>
  </footer>
</div>

<button class="fab" id="fab" type="button"><span class="plus" aria-hidden="true">+</span><span id="fabLabel"></span></button>

<dialog id="authDlg" aria-label="Account">
  <div class="sheet" id="authBody"></div>
</dialog>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form class="sheet" id="blockForm" novalidate></form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<!-- ES modules don't load from file:// — show a hint instead of a blank page -->
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("views").innerHTML =
        '<p class="warn">Open ByteBell with a local server (e.g. VS Code Live Server) or GitHub Pages.<br>' +
        'ローカルサーバー（Live Server など）か GitHub Pages で開いてください。</p>';
    });
  }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
